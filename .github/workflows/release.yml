name: Release image

# Publishing a GitHub release builds the image and pushes it to GitHub's
# registry as ghcr.io/<owner>/battle-bridge, tagged with the version
# (1.2.3, 1.2, 1) and latest.  Then it attaches compose.yml to the release,
# so .../releases/latest/download/compose.yml always gets the newest.

on:
  release:
    types: [published]

permissions:
  contents: write     # to attach compose.yml to the release
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The release tag matches the code's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(python3 -c "import sys; sys.path.insert(0, 'app'); import battle_bridge; print(battle_bridge.VERSION)")
          runner=$(python3 -c "import sys; sys.path.insert(0, 'runner'); import bbrunner; print(bbrunner.VERSION)")
          echo "tag $tag, app $app, runner $runner"
          [ "$tag" = "$app" ] && [ "$tag" = "$runner" ]
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/battle-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attach compose.yml to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" compose.yml --clobber --repo "$GITHUB_REPOSITORY"
