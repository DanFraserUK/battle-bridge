# Passes if the cleanup is keeping up: no recordings past 32 days.  The
# cleanup keeps 31 days and runs at midnight, so allow a day's slack.
label = "No recordings the cleanup missed"
command = ["/usr/bin/find", "/mnt/cameras", "-type", "f", "-mtime", "+32", "-print", "-quit"]
expect = ""
every = "6h"
note = "keeps 31 days"
